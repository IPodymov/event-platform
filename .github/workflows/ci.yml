name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  DJANGO_SECRET_KEY: ci-insecure-secret-key
  DATABASE_URL: postgres://tournaments:tournaments@localhost:5432/tournaments
  REDIS_URL: redis://localhost:6379/0

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tournaments
          POSTGRES_USER: tournaments
          POSTGRES_PASSWORD: tournaments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tournaments"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Run tests
        run: uv run pytest --cov-report=xml
        env:
          HYPOTHESIS_PROFILE: ci

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
