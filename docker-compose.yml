# Local development stack. Start it with ./scripts/dev.sh (Ctrl+C stops it and frees
# the ports). Migrations are run explicitly:
#   docker compose run --rm web python manage.py migrate

x-app: &app
  # tini as PID 1 forwards stop signals to Django/Celery and reaps child processes.
  init: true
  build:
    context: .
    args:
      INSTALL_DEV: "true"
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
    DATABASE_URL: postgres://${POSTGRES_USER:-tournaments}:${POSTGRES_PASSWORD:-tournaments}@db:5432/${POSTGRES_DB:-tournaments}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tournaments}
      POSTGRES_USER: ${POSTGRES_USER:-tournaments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tournaments}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
