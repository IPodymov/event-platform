[project]
name = "tournament-platform"
version = "0.1.0"
description = "Esports tournament platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.5,<6",
    "django>=5.2,<6.0",
    "django-environ>=0.12",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "redis>=6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=5.2,<6",
    "djangorestframework-stubs[compatible-mypy]>=3.16.9",
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.11",
    "mypy>=1.18",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "DJ",       # flake8-django
    "S",        # bandit
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
# RUF012 flags Django `Meta` and DRF class attributes, which are idiomatic lists.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# `strict` cannot be set per module, so its flags are listed explicitly.
[[tool.mypy.overrides]]
module = ["apps.brackets.*", "apps.matches.*", "apps.payments.*", "apps.prizes.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
# --ds wins over a DJANGO_SETTINGS_MODULE exported from .env.
addopts = "--ds=config.settings.test --strict-markers --cov=apps --cov=config --cov-report=term-missing:skip-covered"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]
